
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Profile cá nhân</title>

    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background-color: #f2f5f9;
        }

        .card {
            width: 350px;
            max-width: 100%;
            margin: 50px auto;
            padding: 25px;
            border: 1px solid #d6dce5;
            border-radius: 15px;
            background-color: white;
            text-align: center;
            box-sizing: border-box;
        }

        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 3px solid #4a90e2;
            object-fit: cover;
        }

        #name {
            margin: 15px 0 8px;
            font-size: 28px;
            color: #1f2937;
        }

        .job {
            color: #2878c8;
            font-weight: bold;
        }

        .intro {
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .skills {
            padding: 0;
            list-style: none;
        }

        .skills li {
            display: inline-block;
            margin: 4px 2px;
            padding: 8px 11px;
            border-radius: 8px;
            background-color: #e8f2ff;
        }

        .btn {
            display: inline-block;
            margin-top: 15px;
            padding: 11px 22px;
            border-radius: 8px;
            background-color: #2878c8;
            color: white;
            text-decoration: none;
            transition: 0.25s;
        }

        .btn:hover {
            background-color: #174a80;
        }
    </style>
</head>

<body>
    <div class="card">
        <img class="avatar"
             src="meme.jpg"
             alt="Ảnh đại diện">

        <h1 id="name">LÝ NHẤT QUANG</h1>

        <p class="job">Sinh viên Công nghệ thông tin</p>

        <p class="intro">
            Xin chào! Tôi vinh dự được tham gia thị trường công nghệ.
        </p>

        <h2>Kỹ năng</h2>

        <ul class="skills">
            <li>HTML</li>
            <li>CSS</li>
            <li>JavaScript</li>
        </ul>

        <a class="btn" href="lynhatquang260207@gmail.com">
            Liên hệ
        </a>
    </div>
</body>
</html>
