<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bài 8. Dự đoán nghề nghiệp</title>
  <style>
:root { color-scheme: light; }
* { box-sizing: border-box; }
body {
  margin: 0; padding: 32px 16px; font-family: Arial, sans-serif;
  background: #f3f6fb; color: #202938;
}
main {
  width: min(100%, 620px); margin: 0 auto; padding: 28px;
  background: white; border-radius: 16px; box-shadow: 0 8px 28px #182c4a14;
}
h1 { margin-top: 0; font-size: 26px; color: #174ea6; }
p { line-height: 1.5; }
label { display: block; margin: 14px 0 6px; font-weight: 600; }
input, select {
  width: 100%; padding: 11px 12px; border: 1px solid #cbd5e1;
  border-radius: 8px; font-size: 16px; background: white;
}
button {
  margin-top: 14px; padding: 11px 16px; border: 0; border-radius: 8px;
  background: #2563eb; color: white; font-size: 15px; cursor: pointer;
}
button:hover { background: #1d4ed8; }
button.secondary { background: #64748b; }
.result {
  margin-top: 18px; padding: 14px; min-height: 48px;
  background: #eff6ff; border-radius: 8px; line-height: 1.6;
  overflow-wrap: anywhere;
}
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
small { color: #64748b; }
</style>
</head>
<body>
  <main>
    <h1>Bài 8. Dự đoán nghề nghiệp</h1>
    <p>Nhập tên để xem một nghề nghiệp được chọn ngẫu nhiên (chỉ mang tính giải trí).</p>
    <label for="name">Tên của bạn</label>
<input id="name" type="text" maxlength="60" placeholder="Nhập tên">
<button id="predictBtn">Dự đoán nghề nghiệp</button>
<div id="result" class="result" aria-live="polite">Nghề nghiệp sẽ hiển thị ở đây.</div>
  </main>
  <script>
const nameInput = document.getElementById('name');
const result = document.getElementById('result');
const jobs = [
  'Lập trình viên', 'Giáo viên', 'Bác sĩ', 'Thiết kế đồ họa',
  'Đầu bếp', 'Kỹ sư', 'Nhiếp ảnh gia', 'Doanh nhân',
  'Nhà sáng tạo nội dung', 'Nhà khoa học'
];

document.getElementById('predictBtn').addEventListener('click', function () {
  const name = nameInput.value.trim();
  if (!name) {
    result.textContent = 'Vui lòng nhập tên của bạn.';
    return;
  }

  const job = jobs[Math.floor(Math.random() * jobs.length)];
  result.textContent = name + ', nghề nghiệp dự đoán của bạn là: ' + job +
    '. (Kết quả ngẫu nhiên, chỉ để giải trí.)';
});
  </script>
</body>
</html>
