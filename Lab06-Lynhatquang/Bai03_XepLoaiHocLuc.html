<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bài 3. Xếp loại học lực</title>
  <style>
:root { color-scheme: light; }
* { box-sizing: border-box; }
body {
  margin: 0; padding: 32px 16px; font-family: Arial, sans-serif;
  background: #f3f6fb; color: #202938;
}
main {
  width: min(100%, 620px); margin: 0 auto; padding: 28px;
  background: white; border-radius: 16px; box-shadow: 0 8px 28px #182c4a14;
}
h1 { margin-top: 0; font-size: 26px; color: #174ea6; }
p { line-height: 1.5; }
label { display: block; margin: 14px 0 6px; font-weight: 600; }
input, select {
  width: 100%; padding: 11px 12px; border: 1px solid #cbd5e1;
  border-radius: 8px; font-size: 16px; background: white;
}
button {
  margin-top: 14px; padding: 11px 16px; border: 0; border-radius: 8px;
  background: #2563eb; color: white; font-size: 15px; cursor: pointer;
}
button:hover { background: #1d4ed8; }
button.secondary { background: #64748b; }
.result {
  margin-top: 18px; padding: 14px; min-height: 48px;
  background: #eff6ff; border-radius: 8px; line-height: 1.6;
  overflow-wrap: anywhere;
}
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
small { color: #64748b; }
</style>
</head>
<body>
  <main>
    <h1>Bài 3. Xếp loại học lực</h1>
    <p>Nhập điểm từ 0 đến 100 để xem xếp loại.</p>
    <label for="score">Điểm (0–100)</label>
<input id="score" type="number" min="0" max="100" step="any" placeholder="Ví dụ: 85">
<button id="checkBtn">Xếp loại</button>
<div id="result" class="result" aria-live="polite">Xếp loại sẽ hiển thị ở đây.</div>
  </main>
  <script>
const scoreInput = document.getElementById('score');
const result = document.getElementById('result');

document.getElementById('checkBtn').addEventListener('click', function () {
  const value = scoreInput.value.trim();
  const score = Number(value);

  if (value === '' || !Number.isFinite(score) || score < 0 || score > 100) {
    result.textContent = 'Vui lòng nhập điểm từ 0 đến 100.';
    return;
  }

  let grade;
  if (score >= 90) grade = 'A';
  else if (score >= 80) grade = 'B';
  else if (score >= 70) grade = 'C';
  else if (score >= 60) grade = 'D';
  else grade = 'F';

  result.textContent = 'Điểm ' + score + ' → Xếp loại ' + grade + '.';
});
  </script>
</body>
</html>
