<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bài 10. Máy tính đơn giản</title>
  <style>
:root { color-scheme: light; }
* { box-sizing: border-box; }
body {
  margin: 0; padding: 32px 16px; font-family: Arial, sans-serif;
  background: #f3f6fb; color: #202938;
}
main {
  width: min(100%, 620px); margin: 0 auto; padding: 28px;
  background: white; border-radius: 16px; box-shadow: 0 8px 28px #182c4a14;
}
h1 { margin-top: 0; font-size: 26px; color: #174ea6; }
p { line-height: 1.5; }
label { display: block; margin: 14px 0 6px; font-weight: 600; }
input, select {
  width: 100%; padding: 11px 12px; border: 1px solid #cbd5e1;
  border-radius: 8px; font-size: 16px; background: white;
}
button {
  margin-top: 14px; padding: 11px 16px; border: 0; border-radius: 8px;
  background: #2563eb; color: white; font-size: 15px; cursor: pointer;
}
button:hover { background: #1d4ed8; }
button.secondary { background: #64748b; }
.result {
  margin-top: 18px; padding: 14px; min-height: 48px;
  background: #eff6ff; border-radius: 8px; line-height: 1.6;
  overflow-wrap: anywhere;
}
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
small { color: #64748b; }
</style>
</head>
<body>
  <main>
    <h1>Bài 10. Máy tính đơn giản</h1>
    <p>Nhập hai số và chọn phép tính cần thực hiện.</p>
    <label for="num1">Số thứ nhất</label>
<input id="num1" type="number" step="any" placeholder="Nhập số thứ nhất">
<label for="num2">Số thứ hai</label>
<input id="num2" type="number" step="any" placeholder="Nhập số thứ hai">
<div class="actions">
  <button data-op="add">Cộng (+)</button>
  <button data-op="subtract">Trừ (−)</button>
  <button data-op="multiply">Nhân (×)</button>
  <button data-op="divide">Chia (÷)</button>
</div>
<div id="result" class="result" aria-live="polite">Kết quả sẽ hiển thị ở đây.</div>
  </main>
  <script>
const num1Input = document.getElementById('num1');
const num2Input = document.getElementById('num2');
const result = document.getElementById('result');

document.querySelectorAll('[data-op]').forEach(function (button) {
  button.addEventListener('click', function () {
    const value1 = num1Input.value.trim();
    const value2 = num2Input.value.trim();
    const a = Number(value1);
    const b = Number(value2);

    if (value1 === '' || value2 === '' || !Number.isFinite(a) || !Number.isFinite(b)) {
      result.textContent = 'Vui lòng nhập đầy đủ hai số hợp lệ.';
      return;
    }

    let answer;
    switch (button.dataset.op) {
      case 'add': answer = a + b; break;
      case 'subtract': answer = a - b; break;
      case 'multiply': answer = a * b; break;
      case 'divide':
        if (b === 0) {
          result.textContent = 'Không thể chia cho 0.';
          return;
        }
        answer = a / b;
        break;
    }

    result.textContent = 'Kết quả: ' + answer;
  });
});
  </script>
</body>
</html>
