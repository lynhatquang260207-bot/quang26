<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bài 11. Kiểm tra mật khẩu</title>
  <style>
:root { color-scheme: light; }
* { box-sizing: border-box; }
body {
  margin: 0; padding: 32px 16px; font-family: Arial, sans-serif;
  background: #f3f6fb; color: #202938;
}
main {
  width: min(100%, 620px); margin: 0 auto; padding: 28px;
  background: white; border-radius: 16px; box-shadow: 0 8px 28px #182c4a14;
}
h1 { margin-top: 0; font-size: 26px; color: #174ea6; }
p { line-height: 1.5; }
label { display: block; margin: 14px 0 6px; font-weight: 600; }
input, select {
  width: 100%; padding: 11px 12px; border: 1px solid #cbd5e1;
  border-radius: 8px; font-size: 16px; background: white;
}
button {
  margin-top: 14px; padding: 11px 16px; border: 0; border-radius: 8px;
  background: #2563eb; color: white; font-size: 15px; cursor: pointer;
}
button:hover { background: #1d4ed8; }
button.secondary { background: #64748b; }
.result {
  margin-top: 18px; padding: 14px; min-height: 48px;
  background: #eff6ff; border-radius: 8px; line-height: 1.6;
  overflow-wrap: anywhere;
}
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
small { color: #64748b; }
</style>
</head>
<body>
  <main>
    <h1>Bài 11. Kiểm tra mật khẩu</h1>
    <p>Nhập mật khẩu. Mật khẩu hợp lệ khi có ít nhất 8 ký tự.</p>
    <label for="password">Mật khẩu</label>
<input id="password" type="password" placeholder="Nhập mật khẩu">
<button id="checkBtn">Kiểm tra</button>
<div id="result" class="result" aria-live="polite">Kết quả sẽ hiển thị ở đây.</div>
  </main>
  <script>
const passwordInput = document.getElementById('password');
const result = document.getElementById('result');

document.getElementById('checkBtn').addEventListener('click', function () {
  const password = passwordInput.value;

  if (password.length >= 8) {
    result.textContent = 'Mật khẩu hợp lệ.';
  } else {
    result.textContent = 'Mật khẩu quá ngắn. Cần ít nhất 8 ký tự.';
  }
});
  </script>
</body>
</html>
