<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký mua hoa</title>
</head>
<body>
    <h2 style="text-align: center;">ĐĂNG KÝ MUA HOA</h2>
    <p style="color: red;">Quý độc giả hãy điền đầy đủ các thông tin theo yêu cầu để nhận được sản phẩm hoa, cây cảnh yêu thích nhất.</p>
    <form action="#" method="post" style="width: 500px; margin: auto;">
        <p>
            <label for="hoten">Họ và tên:</label>
            <input type="text" id="hoten" name="hoten" required> (*)
        </p>
        <p>
            <label for="diachi">Địa chỉ:</label>
            <input type="text" id="diachi" name="diachi" required> (*)
        </p>
        <p>
            <label for="dienthoai">Điện thoại:</label>
            <input type="tel" id="dienthoai" name="dienthoai" required> (*)
        </p>
        <p>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required> (*)
        </p>
        <p>
            <label for="loaihoa">Loại hoa:</label>
            <select id="loaihoa" name="loaihoa">
                <option>Hoa Hồng</option>
                <option>Hoa Lan</option>
                <option>Hoa Cúc</option>
                <option>Hoa Ly</option>
            </select>
            <label for="mauhoa">Màu:</label>
            <select id="mauhoa" name="mauhoa">
                <option>Đỏ</option>
                <option>Trắng</option>
                <option>Vàng</option>
                <option>Hồng</option>
            </select>
        </p>
        <p>
            <label for="soluong">Số lượng:</label>
            <input type="number" id="soluong" name="soluong" min="1" required>
        </p>
        <p>Đơn vị tính:
            <label><input type="radio" name="donvi" value="Nhành"> Nhành</label>
            <label><input type="radio" name="donvi" value="Bó"> Bó</label>
            <label><input type="radio" name="donvi" value="Chậu"> Chậu</label>
        </p>
        <p>Thanh toán:
            <label><input type="radio" name="thanhtoan" value="Tiền mặt"> Tiền mặt</label>
            <label><input type="radio" name="thanhtoan" value="Chuyển khoản"> Chuyển khoản</label>
            <label><input type="radio" name="thanhtoan" value="Master card"> Master card</label>
        </p>
        <p>
            <label for="yeucau">Yêu cầu:</label><br>
            <textarea id="yeucau" name="yeucau" rows="5" style="width: 100%;"></textarea>
        </p>
        <p style="text-align: center;">
            <button type="submit">Đăng ký</button>
            <button type="reset">Nhập lại</button>
        </p>
    </form>
</body>
</html>
