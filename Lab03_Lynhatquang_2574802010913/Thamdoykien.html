<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phiếu thăm dò ý kiến</title>
</head>
<body>
    <h2 style="text-align: center;">PHIẾU THĂM DÒ Ý KIẾN</h2>
    <form action="#" method="post" style="width: 380px; margin: auto;">
        <p>
            <label for="username">Tên đăng nhập:</label><br>
            <input type="text" id="username" name="username">
        </p>
        <p>Giới tính:
            <label><input type="radio" name="gioitinh" value="Nam"> Nam</label>
            <label><input type="radio" name="gioitinh" value="Nữ"> Nữ</label>
        </p>
        <p>Những mục bạn thường quan tâm trên Internet:</p>
        <p>
            <label><input type="checkbox" name="quanTam" value="Tin tức"> Tin tức</label><br>
            <label><input type="checkbox" name="quanTam" value="Giải trí"> Giải trí</label><br>
            <label><input type="checkbox" name="quanTam" value="Góc học tập"> Góc học tập</label><br>
            <label><input type="checkbox" name="quanTam" value="Giáo dục"> Giáo dục</label><br>
            <label><input type="checkbox" name="quanTam" value="Các mục khác"> Các mục khác</label>
        </p>
        <p style="text-align: center;">
            <button type="reset">Cancel</button>
            <button type="submit">Gửi đi</button>
        </p>
    </form>
</body>
</html>
