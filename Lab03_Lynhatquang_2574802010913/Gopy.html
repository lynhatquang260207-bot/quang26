<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đóng góp ý kiến</title>
</head>
<body>
    <h2 style="text-align: center;">ĐÓNG GÓP Ý KIẾN</h2>
    <form action="#" method="post" style="width: 420px; margin: auto;">
        <p>
            <label for="hoten">Họ và tên:</label><br>
            <input type="text" id="hoten" name="hoten" style="width: 100%;">
        </p>
        <p>
            <label for="gopy">Nội dung góp ý:</label><br>
            <textarea id="gopy" name="gopy" rows="7" style="width: 100%;"></textarea>
        </p>
        <p style="text-align: center;">
            <button type="reset">Nhập lại</button>
            <button type="submit">Gửi góp ý</button>
        </p>
    </form>
</body>
</html>
