<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông tin thành viên</title>
</head>
<body>
    <h2 style="text-align: center;">PHIẾU ĐĂNG KÝ</h2>
    <form action="#" method="post" style="width: 500px; margin: auto;">
        <p>
            <label for="hoten">Họ và tên:</label><br>
            <input type="text" id="hoten" name="hoten" required>
            <span>(*)</span>
        </p>
        <p>
            <label for="diachi">Địa chỉ:</label><br>
            <input type="text" id="diachi" name="diachi" style="width: 80%;">
        </p>
        <p>
            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email" required>
            <span>(*)</span>
        </p>
        <p>Giới tính:
            <label><input type="radio" name="gioitinh" value="Nam"> Nam</label>
            <label><input type="radio" name="gioitinh" value="Nữ"> Nữ</label>
        </p>
        <p>
            <label for="tuoi">Tuổi:</label><br>
            <input type="number" id="tuoi" name="tuoi" min="1" required>
            <span>(*)</span>
        </p>
        <p>Sở thích:</p>
        <p>
            <label><input type="checkbox" name="sothich" value="Thể thao"> Thể thao</label><br>
            <label><input type="checkbox" name="sothich" value="Văn học"> Văn học</label><br>
            <label><input type="checkbox" name="sothich" value="Công nghệ thông tin"> Công nghệ thông tin</label><br>
            <label><input type="checkbox" name="sothich" value="Lịch sử"> Lịch sử</label><br>
            <label><input type="checkbox" name="sothich" value="Game"> Game</label>
        </p>
        <p>
            <label for="chuyennganh">Chuyên ngành:</label><br>
            <select id="chuyennganh" name="chuyennganh">
                <option>Công nghệ Web</option>
                <option>Công nghệ phần mềm</option>
                <option>Mạng máy tính</option>
                <option>Hệ thống thông tin</option>
            </select>
        </p>
        <p>
            <label for="ghihinh">Ghi hình:</label><br>
            <input type="file" id="ghihinh" name="ghihinh" accept="video/*">
        </p>
        <p>
            <label for="yeucau">Yêu cầu:</label><br>
            <textarea id="yeucau" name="yeucau" rows="5" style="width: 100%;"></textarea>
        </p>
        <p style="text-align: center;">
            <button type="submit">Gửi thông tin</button>
            <button type="reset">Nhập lại</button>
        </p>
    </form>
</body>
</html>
