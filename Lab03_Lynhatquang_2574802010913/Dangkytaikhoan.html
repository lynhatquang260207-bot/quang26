<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký tài khoản</title>
</head>
<body>
    <h2 style="text-align: center;">ĐĂNG KÝ TÀI KHOẢN</h2>
    <form action="#" method="post" style="width: 380px; margin: auto;">
        <p>
            <label for="username">Nhập username</label><br>
            <input type="text" id="username" name="username">
        </p>
        <p>
            <label for="password">Nhập mật khẩu</label><br>
            <input type="password" id="password" name="password">
        </p>
        <p>
            <label for="email">Nhập địa chỉ email</label><br>
            <input type="email" id="email" name="email">
        </p>
        <p>
            <label for="ngaysinh">Ngày sinh</label><br>
            <input type="date" id="ngaysinh" name="ngaysinh">
        </p>
        <p>Giới tính:<br>
            <label><input type="radio" name="gioitinh" value="Nam"> Nam</label>
            <label><input type="radio" name="gioitinh" value="Nữ"> Nữ</label>
        </p>
        <p>Sở thích:</p>
        <p>
            <label><input type="checkbox" name="sothich" value="Xem phim"> Xem phim</label><br>
            <label><input type="checkbox" name="sothich" value="Nghe nhạc"> Nghe nhạc</label><br>
            <label><input type="checkbox" name="sothich" value="Đọc sách"> Đọc sách</label><br>
            <label><input type="checkbox" name="sothich" value="Du lịch"> Du lịch</label>
        </p>
        <p>
            <label for="gioithieu">Giới thiệu bản thân</label><br>
            <textarea id="gioithieu" name="gioithieu" rows="5" style="width: 100%;"></textarea>
        </p>
        <p style="text-align: center;">
            <button type="reset">Cancel</button>
            <button type="submit">Đăng ký</button>
        </p>
    </form>
</body>
</html>
